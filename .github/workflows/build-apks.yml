name: Build Personal Agent APKs
on:
  push:
    branches: [main]
    paths:
      - 'PersonalAgent-Suite-Updated (1).zip'
      - '.github/workflows/build-apks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract suite archive and embedded build inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p suite
          unzip -q 'PersonalAgent-Suite-Updated (1).zip' -d suite
          test -f suite/github-actions-repo/private-agent.zip
          test -f suite/github-actions-repo/customize_split_apps.py
          mkdir -p build-input
          cp suite/github-actions-repo/private-agent.zip build-input/private-agent.zip
          cp suite/github-actions-repo/customize_split_apps.py build-input/customize_split_apps.py
          echo "BUILD_INPUT=$GITHUB_WORKSPACE/build-input" >> "$GITHUB_ENV"
      - name: Prepare Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q "$BUILD_INPUT/private-agent.zip" -d extracted
          PROJECT_DIR="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"
      - name: Customize split Client and Admin apps
        shell: bash
        run: |
          set -euo pipefail
          python3 "$BUILD_INPUT/customize_split_apps.py" "$PROJECT_DIR"
      - name: Fix DevicePolicyHelper method references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("$GITHUB_WORKSPACE/extracted/app/src/main/java")
          for p in root.rglob("*.kt"):
              s = p.read_text()
              s = s.replace("policyHelper.isDeviceAdminActive()", "policyHelper.isAdminActive()")
              s = s.replace("dpcHelper.isDeviceAdminActive()", "dpcHelper.isAdminActive()")
              s = s.replace("dpcHelper.isDeviceOwner()", "dpcHelper.devicePolicyManager.isDeviceOwnerApp(packageName)")
              p.write_text(s)
          PY
      - name: Align compileSdk with AndroidX dependencies
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/compileSdk = 35/compileSdk = 36/g; s/compileSdk 35/compileSdk 36/g' "$PROJECT_DIR/app/build.gradle.kts"
          grep -n 'compileSdk' "$PROJECT_DIR/app/build.gradle.kts"
      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$GITHUB_WORKSPACE/extracted/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build debug APKs
        shell: bash
        run: gradle -p "$PROJECT_DIR" assembleClientDebug assembleAdminDebug --stacktrace
      - name: Verify and collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output/source
          find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -print
          CLIENT_APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' | grep -i '/client/' | head -1 || true)"
          ADMIN_APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' | grep -i '/admin/' | head -1 || true)"
          test -n "$CLIENT_APK" && test -n "$ADMIN_APK"
          cp "$CLIENT_APK" release-output/PersonalAgent-Client-debug.apk
          cp "$ADMIN_APK" release-output/PersonalAgent-Admin-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose release-output/PersonalAgent-Client-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release-output/PersonalAgent-Admin-debug.apk
          CLIENT_ID="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release-output/PersonalAgent-Client-debug.apk | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -1)"
          ADMIN_ID="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release-output/PersonalAgent-Admin-debug.apk | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -1)"
          test -n "$CLIENT_ID" && test -n "$ADMIN_ID" && test "$CLIENT_ID" != "$ADMIN_ID"
          echo "Client package: $CLIENT_ID"
          echo "Admin package: $ADMIN_ID"
          (cd "$PROJECT_DIR" && zip -qr "$GITHUB_WORKSPACE/release-output/source/PersonalAgent-Updated-Source.zip" . -x '*/build/*' '*/.gradle/*' '.gradle/*' '*/.idea/*')
          (cd release-output && sha256sum PersonalAgent-Client-debug.apk PersonalAgent-Admin-debug.apk source/PersonalAgent-Updated-Source.zip > SHA256SUMS.txt)
      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAgent-Client-APK
          path: release-output/PersonalAgent-Client-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAgent-Admin-APK
          path: release-output/PersonalAgent-Admin-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload updated source
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAgent-Updated-Source
          path: release-output/source/PersonalAgent-Updated-Source.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAgent-SHA256SUMS
          path: release-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

# Build workflow uses compileSdk 36 for androidx.core 1.18.
